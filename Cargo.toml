[package]
name = "portus"
version = "0.8.0"
authors = ["Akshay Narayan <akshayn@brown.edu>", "Frank Cangialosi <frankc@csail.mit.edu>", "Deepti Raghavan <deeptir@cs.stanford.edu>"]
description = "A Congestion Control Plane"
homepage = "https://ccp-project.github.io"
documentation = "https://docs.rs/portus"
repository = "https://github.com/ccp-project/portus"
readme = "./README.md"
license = "ISC"
edition = "2024"

[features]
default = []
ccp-bin = ["syn", "clap/derive", "itertools", "quote", "regex", "toml", "proc-macro2", "libloading", "walkdir", "colored"]
ipc-latency = ["time"]

[dependencies]
byteorder      =  "1"
crossbeam      =  "0.8"
libc           =  "0.2"
nix            =  { version = "0.30", features = ["socket", "uio", "poll"] }
nom            =  "7"
portus_export  =  "0.2"
tracing        =  "0.1"
clap           =  { version = "4", optional = true }
itertools      =  { version = "0.10", optional = true }
quote          =  { version = "1", optional = true }
regex          =  { version = "1.1", optional = true }
toml           =  { version = "0.5", optional = true }
proc-macro2    =  { version = "1", optional = true }
libloading     =  { version = "0.7", optional = true }
walkdir        =  { version = "2", optional = true }
syn            =  { version = "1", features = ["full", "visit", "fold", "extra-traits","parsing"], optional = true }
colored        =  { version = "2", optional = true }
time           =  { version = "0.2", optional = true }

[dev-dependencies]
anyhow             = "1"
libccp             = "1.2"
minion             = "0.1"
tracing-subscriber = "0.3.20"

[[bin]]
name = "ipc_latency"
required-features = ["ipc-latency"]

[[bin]]
name = "ccp"
required-features = ["ccp-bin"]

[[bin]]
name = "cargo-compile-fast-path"
required-features = ["ccp-bin"]
